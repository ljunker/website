<!doctype html>
<html lang="de">
<head>
    <title>One Piece | Lars Junker</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Status meiner One-Piece-Bände, beim Build aus meiner Tabelle übernommen."/>

    <link rel="icon" href="/favicon.ico">

    <link rel="stylesheet" href="/static/style.css?v=5">
    <link rel="stylesheet" href="/static/ansi.css?v=2">
</head>
<body>
<div id="container">
    <header>
        <div w3-include-html="/nav.html"></div>
    </header>

    <main>
        <h1 class="title">one piece</h1>
        <p class="content">
            Status meiner One-Piece-Bände, beim Build aus meiner Tabelle übernommen.
        </p>
        <p class="content" id="one-piece-status"></p>
        <br>

        <table id="one-piece-table" class="shadow">
            <caption>Bände</caption>
            <thead>
            <tr>
                <th>NUMMER</th>
                <th>STATUS</th>
            </tr>
            </thead>
            <tbody id="one-piece-tbody">
            </tbody>
        </table>
    </main>

    <footer>
        <pre class="footer"><code>
&copy; Lars Junker - <script>document.write(new Date().getFullYear())</script>
<a href="/impressum">impressum</a>
        </code></pre>
    </footer>
</div>
<script src="/static/one-piece.js"></script>
<script>
    (function () {
        var tbody = document.getElementById('one-piece-tbody');
        var statusEl = document.getElementById('one-piece-status');
        if (!tbody || !statusEl) return;

        if (typeof ONEPIECE === 'undefined' || !ONEPIECE.baende || ONEPIECE.baende.length === 0) {
            statusEl.textContent = 'Keine Daten verfügbar.';
            return;
        }

        ONEPIECE.baende.forEach(function (b) {
            var tr = document.createElement('tr');
            [b.nummer, b.status].forEach(function (txt) {
                var td = document.createElement('td');
                td.textContent = txt || '';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        statusEl.textContent = 'Stand: ' + new Date(ONEPIECE.generated * 1000).toLocaleString('de-DE', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        }) + ' Uhr';
    })();
</script>
<script>
    function includeHTML() {
        var z, i, elmnt, file, xhttp;
        /* Loop through a collection of all HTML elements: */
        z = document.getElementsByTagName("*");
        for (i = 0; i < z.length; i++) {
            elmnt = z[i];
            /*search for elements with a certain atrribute:*/
            file = elmnt.getAttribute("w3-include-html");
            if (file) {
                /* Make an HTTP request using the attribute value as the file name: */
                xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function() {
                    if (this.readyState == 4) {
                        if (this.status == 200) {elmnt.innerHTML = this.responseText;}
                        if (this.status == 404) {elmnt.innerHTML = "Page not found.";}
                        /* Remove the attribute, and call this function once more: */
                        elmnt.removeAttribute("w3-include-html");
                        includeHTML();
                    }
                }
                xhttp.open("GET", file, true);
                xhttp.send();
                /* Exit the function: */
                return;
            }
        }
    }
</script>
<script>
    includeHTML();
</script>
</body>
</html>
