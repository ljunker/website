<!doctype html>
<html lang="de">
<head>
    <title>One Piece | Lars Junker</title>
    <!-- include:head -->
    <meta name="description" content="Status meiner One-Piece-Bände, beim Build aus meiner Tabelle übernommen."/>
</head>
<body>
<div id="container">
    <header>
        <!-- include:nav -->
    </header>

    <main>
        <h1 class="title">one piece</h1>
        <p class="content">
            Status meiner One-Piece-Bände, beim Build aus meiner Tabelle übernommen.
        </p>
        <p class="content" id="one-piece-status"></p>
        <br>

        <table id="one-piece-table" class="shadow">
            <caption>Bände</caption>
            <thead>
            <tr>
                <th>NUMMER</th>
                <th>STATUS</th>
            </tr>
            </thead>
            <tbody id="one-piece-tbody">
            </tbody>
        </table>
    </main>

    <!-- include:footer -->
</div>
<script src="/static/one-piece.js"></script>
<script>
    (function () {
        var tbody = document.getElementById('one-piece-tbody');
        var statusEl = document.getElementById('one-piece-status');
        if (!tbody || !statusEl) return;

        if (typeof ONEPIECE === 'undefined' || !ONEPIECE.baende || ONEPIECE.baende.length === 0) {
            statusEl.textContent = 'Keine Daten verfügbar.';
            return;
        }

        ONEPIECE.baende.forEach(function (b) {
            var tr = document.createElement('tr');
            [b.nummer, b.status].forEach(function (txt) {
                var td = document.createElement('td');
                td.textContent = txt || '';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        statusEl.textContent = 'Stand: ' + new Date(ONEPIECE.generated * 1000).toLocaleString('de-DE', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        }) + ' Uhr';
    })();
</script>
</body>
</html>
