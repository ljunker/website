<!doctype html>
<html lang="de">
<head>
    <title>calltermine | Lars Junker</title>
    <!-- include:head -->
    <meta name="description" content="Calltermine von Lars Junker für die nächsten Wochen."/>
</head>
<body>
<div id="container">
    <header>
        <!-- include:nav -->
    </header>

    <main>
        <h1 class="title">calltermine</h1>
        <p class="content">
				<span class="highlight">Hier stehen meine Calltermine,
                    jeweils für einen Zeitraum von 8 Wochen. Mit den Buttons über der Liste
                    kann man beliebig weit in die Zukunft blättern. Den Kalender kann man auch
                    <a href="webcal://p131-caldav.icloud.com/published/2/MTAzODAyMzk0NDkxMDM4MKx0EePtPDXePVZMEANU5wgvh8UiCQKBUo_2X7Xqg9Jh3NtXpIyVy5CqwdHizblJlRvhMBUjjWdRQ3aI_qnXqcw">abonnieren</a>.
                    Um einen neuen Termin mit mir abzusprechen, <a href="mailto:caller@kryptikk.de">schick mir einfach eine Mail.</a></span>
            <br />
            <span><a href="https://www.ceder.net/callerdb/" target="_blank" rel="noopener noreferrer">Callers and Cuers</a></span>
        </p>
        <br>

        <div class="schedule-nav">
            <button type="button" id="nav-prev">&laquo; früher</button>
            <div class="center">
                <span class="range" id="nav-range"></span>
                <button type="button" id="nav-today">heute</button>
            </div>
            <button type="button" id="nav-next">später &raquo;</button>
        </div>

        <ol class="schedule-cards" id="schedule-list" role="list"></ol>
    </main>

    <!-- include:footer -->
</div>
<script src="/static/ical.min.js?v=1"></script>
<script>
(function () {
    var FEED_URL = '/schedule/calendar.ics';
    var WEBCAL_URL = 'webcal://p131-caldav.icloud.com/published/2/MTAzODAyMzk0NDkxMDM4MKx0EePtPDXePVZMEANU5wgvh8UiCQKBUo_2X7Xqg9Jh3NtXpIyVy5CqwdHizblJlRvhMBUjjWdRQ3aI_qnXqcw';
    var WEEKS = 8;
    var MAX_OCCURRENCES = 20000;

    var list = document.getElementById('schedule-list');
    var prevBtn = document.getElementById('nav-prev');
    var nextBtn = document.getElementById('nav-next');
    var todayBtn = document.getElementById('nav-today');
    var rangeLabel = document.getElementById('nav-range');

    var items = null; // alle (nicht expandierten) Termine, nur einmal geparst
    var failed = false;

    var berlin = new Intl.DateTimeFormat('de-DE', {
        timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    });

    function pad(n) { return (n < 10 ? '0' : '') + n; }

    function berlinParts(d) {
        var o = {};
        berlin.formatToParts(d).forEach(function (p) { o[p.type] = p.value; });
        return { date: o.year + '-' + o.month + '-' + o.day, time: o.hour + ':' + o.minute };
    }

    function format(icalTime) {
        if (icalTime.isDate) {
            return { date: icalTime.year + '-' + pad(icalTime.month) + '-' + pad(icalTime.day), time: '00:00' };
        }
        return berlinParts(icalTime.toJSDate());
    }

    // Beginn eines Termins als lokales Date (Ganztags: lokaler Mitternacht)
    function startMillis(icalTime) {
        if (icalTime.isDate) return new Date(icalTime.year, icalTime.month - 1, icalTime.day).getTime();
        return icalTime.toJSDate().getTime();
    }

    var WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

    // "YYYY-MM-DD" -> "Sa 21.11.2026"; Wochentag per UTC, damit keine Zeitzone ihn verschiebt
    function prettyDate(iso) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
        if (!m) return iso;
        var wd = WEEKDAYS[new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).getUTCDay()];
        return wd + ' ' + m[3] + '.' + m[2] + '.' + m[1];
    }

    function el(tag, className, txt) {
        var e = document.createElement(tag);
        if (className) e.className = className;
        if (txt) e.textContent = txt;
        return e;
    }

    function mapsLink(txt) {
        var a = document.createElement('a');
        a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(txt);
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = txt;
        a.setAttribute('aria-label', 'Adresse in Google Maps öffnen: ' + txt);
        return a;
    }

    function getUrl(ev) {
        var raw = ev && ev.component && ev.component.getFirstPropertyValue('url');
        raw = (raw || '').toString().trim();
        return /^https?:\/\//i.test(raw) ? raw : '';
    }

    function titleLink(txt, url) {
        var a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = txt || '';
        a.setAttribute('aria-label', 'Homepage von ' + (txt || '') + ' öffnen (neuer Tab)');
        return a;
    }

    function statusCard(content) {
        var li = el('li', 'schedule-card schedule-status shadow');
        if (typeof content === 'string') {
            li.textContent = content;
        } else {
            li.appendChild(content);
        }
        return li;
    }

    function eventCard(evt) {
        var li = el('li', 'schedule-card shadow');

        var head = el('div', 'card-head');
        var time = el('time', 'card-date', prettyDate(evt.date));
        time.setAttribute('datetime', evt.date);
        head.appendChild(time);
        var range = evt.time + (evt.end_time && evt.end_time !== evt.time ? ' – ' + evt.end_time : '');
        head.appendChild(el('span', 'card-time', range));
        li.appendChild(head);

        if (evt.details) {
            var title = el('h2', 'card-title');
            if (evt.url) title.appendChild(titleLink(evt.details, evt.url));
            else title.textContent = evt.details;
            li.appendChild(title);
        }
        if (evt.location) {
            var loc = el('div', 'card-location');
            loc.appendChild(mapsLink(evt.location));
            li.appendChild(loc);
        }
        return li;
    }

    function parseFeed(text) {
        var root = new ICAL.Component(ICAL.parse(text));
        root.getAllSubcomponents('vtimezone').forEach(function (vtz) {
            try { ICAL.TimezoneService.register(vtz); } catch (e) { /* ignorieren */ }
        });
        var vevents = root.getAllSubcomponents('vevent');
        var exceptions = [];
        var masters = [];
        vevents.forEach(function (ve) {
            if (ve.hasProperty('recurrence-id')) exceptions.push(ve); else masters.push(ve);
        });
        return masters.map(function (ve) {
            var ev = new ICAL.Event(ve);
            exceptions.forEach(function (ex) {
                if (ex.getFirstPropertyValue('uid') === ev.uid) ev.relateException(new ICAL.Event(ex));
            });
            return ev;
        });
    }

    function collect(windowStart, windowEnd) {
        var lo = windowStart.getTime(), hi = windowEnd.getTime();
        var out = [];

        function add(startDate, endDate, ev, fallbackUrl) {
            var t = startMillis(startDate);
            if (t < lo || t >= hi) return;
            var s = format(startDate);
            var e = endDate ? format(endDate) : s;
            out.push({
                t: t, date: s.date, time: s.time, end_time: e.time,
                details: ev.summary || '',
                url: getUrl(ev) || fallbackUrl || '',
                location: (ev.location || '').replace(/\s*[\r\n]+\s*/g, ', ')
            });
        }

        items.forEach(function (ev) {
            try {
                if (ev.isRecurring()) {
                    var it = ev.iterator();
                    var next, n = 0;
                    while ((next = it.next()) && n++ < MAX_OCCURRENCES) {
                        if (startMillis(next) >= hi) break;
                        var occ = ev.getOccurrenceDetails(next);
                        // verschobene Einzeltermine werden unten separat behandelt
                        if (occ.item !== ev) continue;
                        add(occ.startDate, occ.endDate, ev);
                    }
                    // verschobene Einzeltermine (RECURRENCE-ID) nach ihrem
                    // tatsaechlichen Datum einsortieren, auch wenn das
                    // urspruengliche Datum ausserhalb des Fensters liegt
                    Object.keys(ev.exceptions).forEach(function (key) {
                        var ex = ev.exceptions[key];
                        add(ex.startDate, ex.endDate, ex, getUrl(ev));
                    });
                } else {
                    add(ev.startDate, ev.endDate, ev);
                }
            } catch (err) {
                if (window.console) console.error('Termin übersprungen:', err);
            }
        });

        out.sort(function (a, b) { return a.t - b.t; });
        return out;
    }

    function getPage() {
        var m = /^#seite=(\d+)$/.exec(location.hash);
        return m ? Math.max(0, parseInt(m[1], 10)) : 0;
    }

    function fmtDay(d) { return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); }

    function render() {
        var page = getPage();
        var today = new Date();
        var windowStart = new Date(today.getFullYear(), today.getMonth(), today.getDate() + page * WEEKS * 7);
        var windowEnd = new Date(today.getFullYear(), today.getMonth(), today.getDate() + (page + 1) * WEEKS * 7);
        var lastDay = new Date(windowEnd.getFullYear(), windowEnd.getMonth(), windowEnd.getDate() - 1);

        rangeLabel.textContent = fmtDay(windowStart) + ' – ' + fmtDay(lastDay);
        prevBtn.disabled = page === 0;
        todayBtn.disabled = page === 0;
        nextBtn.disabled = failed;
        list.textContent = '';

        if (failed) {
            var span = document.createElement('span');
            span.appendChild(document.createTextNode('Die Termine konnten nicht geladen werden. Der Kalender lässt sich '));
            var a = document.createElement('a');
            a.href = WEBCAL_URL;
            a.textContent = 'hier abonnieren';
            span.appendChild(a);
            span.appendChild(document.createTextNode('.'));
            list.appendChild(statusCard(span));
            return;
        }
        if (!items) {
            list.appendChild(statusCard('Lade Termine…'));
            return;
        }

        var events = collect(windowStart, windowEnd);
        if (!events.length) {
            list.appendChild(statusCard('Keine Termine in diesem Zeitraum'));
            return;
        }
        events.forEach(function (evt) { list.appendChild(eventCard(evt)); });
    }

    function go(page) {
        location.hash = page > 0 ? '#seite=' + page : '';
        if (page <= 0 && location.hash === '') {
            // hashchange feuert bei leerem Hash ggf. nicht zuverlaessig
            render();
        }
    }

    prevBtn.addEventListener('click', function () { go(Math.max(0, getPage() - 1)); });
    nextBtn.addEventListener('click', function () { go(getPage() + 1); });
    todayBtn.addEventListener('click', function () { go(0); });
    window.addEventListener('hashchange', render);

    render();

    fetch(FEED_URL, {cache: 'no-store'})
        .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
        })
        .then(function (text) {
            items = parseFeed(text);
            render();
        })
        .catch(function (err) {
            if (window.console) console.error(err);
            failed = true;
            render();
        });
})();
</script>
</body>
</html>
