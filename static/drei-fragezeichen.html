<!doctype html>
<html lang="de">
<head>
    <title>Drei Fragezeichen | Lars Junker</title>
    <!-- include:head -->
    <meta name="description" content="Sammlung der Drei ??? Kassetten von Lars Junker."/>
</head>
<body>
<div id="container">
    <header>
        <!-- include:nav -->
    </header>

    <main>
        <h1 class="title">drei ???</h1>
        <p class="content">
				<span class="highlight">Ich sammele alle Folgen der Drei ??? auf Kassette.</span>
        </p>
        <p>
            <span id="collection-progress"></span>
        </p>
        <p class="content" id="missing-ranges"></p>
        <br>

        <table id="episodes-table" class="shadow">
            <caption>Gesammelte Folgen</caption>
            <thead>
            <tr>
                <th>COVER</th>
                <th>NUMMER</th>
                <th>NAME</th>
            </tr>
            </thead>
            <tbody id="episodes-tbody">
            </tbody>
        </table>
    </main>

    <!-- include:footer -->
</div>
<script src="/static/drei.js"></script>
<script>

    var tbody = document.getElementById('episodes-tbody');

    function buildMissingRanges(items) {
        var missing = items
            .filter(function (evt) { return evt.collected !== 'gesammelt'; })
            .map(function (evt) { return parseInt(evt.number, 10); })
            .filter(function (n) { return !isNaN(n); })
            .sort(function (a, b) { return a - b; });

        if (!missing.length) return '';

        var ranges = [];
        var start = missing[0];
        var prev = missing[0];

        for (var i = 1; i < missing.length; i++) {
            var current = missing[i];
            if (current === prev + 1) {
                prev = current;
                continue;
            }
            ranges.push(start === prev ? String(start) : (start + '-' + prev));
            start = current;
            prev = current;
        }
        ranges.push(start === prev ? String(start) : (start + '-' + prev));

        return ranges.join(', ');
    }

    var missingText = buildMissingRanges(DREI.drei);
    var missingEl = document.getElementById('missing-ranges');
    var progressEl = document.getElementById('collection-progress');
    var collectedCount = DREI.drei.filter(function (evt) {
        return evt.collected === 'gesammelt';
    }).length;
    var totalCount = DREI.drei.length;
    var collectedPercent = totalCount ? ((collectedCount / totalCount) * 100) : 0;

    if (progressEl) {
        progressEl.textContent = ' Aktuell: ' + collectedCount + ' von ' + totalCount + ' Folgen (' + collectedPercent.toLocaleString('de-DE', {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }) + ' %).';
    }

    if (missingEl) {
        missingEl.textContent = missingText ? ('Es fehlen mir: ' + missingText) : 'Es fehlen mir: keine';
    }

    DREI.drei.filter(function (evt) {
        return evt.collected === 'gesammelt';
    }).forEach(function (evt) {
        var tr = document.createElement('tr');

        function tdWithText(txt, className) {
            var td = document.createElement('td');
            if (className) td.classList.add(className);
            td.textContent = txt || '';
            return td;
        }

        function tdWithCover(url) {
            var td = document.createElement('td');
            td.classList.add('cover');
            if (url) {
                var img = document.createElement('img');
                img.src = url;
                img.alt = 'Cover ' + (evt.number || '');
                img.loading = 'lazy';
                img.decoding = 'async';
                td.appendChild(img);
            }
            return td;
        }

        tr.appendChild(tdWithCover(evt.cover));
        tr.appendChild(tdWithText(evt.number, 'number'));
        tr.appendChild(tdWithText(evt.name, 'name'));

        tbody.appendChild(tr);
    });
</script>
</body>
</html>
